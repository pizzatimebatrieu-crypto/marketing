<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập – FB Page Hub</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1e21; --muted:#65676b; --line:#e4e6eb; --c1:#1877f2; --bad:#d93025; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181a; --card:#212326; --text:#e8eaed; --muted:#9aa0a6; --line:#34373b; --c1:#5b9cff; --bad:#ff7b72; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  form { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; width:min(360px,92vw); }
  h1 { font-size:18px; margin:0 0 16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:transparent;
          color:var(--text); font:inherit; }
  button { margin-top:18px; width:100%; padding:10px; border:0; border-radius:8px; background:var(--c1);
           color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  #err { color:var(--bad); font-size:13px; min-height:1.2em; margin-top:12px; }
</style>
</head>
<body>
<form id="f">
  <h1>Tổng hợp Facebook Page</h1>
  <label for="u">Tài khoản</label>
  <input id="u" autocomplete="username" autocapitalize="none" required autofocus>
  <label for="p">Mật khẩu</label>
  <input id="p" type="password" autocomplete="current-password" required>
  <div id="err"></div>
  <button id="b">Đăng nhập</button>
</form>
<script>
const $ = s => document.querySelector(s);
$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  $("#err").textContent = ""; $("#b").disabled = true;
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("#u").value, password: $("#p").value }) });
    if (r.ok) { location.href = "/"; return; }
    let m = "Đăng nhập thất bại";
    try { const d = await r.json(); if (typeof d.detail === "string") m = d.detail; } catch (_) {}
    $("#err").textContent = m;
  } catch (_) { $("#err").textContent = "Không kết nối được máy chủ"; }
  $("#b").disabled = false;
});
</script>
</body>
</html>
